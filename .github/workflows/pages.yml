name: Deploy Mindy to GitHub Pages

# Auto-publishes the browser-only game in docs/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches:
      - master
      - claude/mindy-dm-game-9lj5a6
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow this workflow to publish Pages, and let it cancel an in-flight deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
